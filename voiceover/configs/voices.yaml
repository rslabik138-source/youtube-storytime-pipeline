# Voice catalog for internal/catalog.Select. American English only
# (af_* = American female, am_* = American male, per Kokoro's own locale
# prefix convention — confirmed against the live voice list: b=British,
# e=Spanish, f=French, h=Hindi, i=Italian, j=Japanese, p=Portuguese,
# z=Mandarin all showed up too, af_/am_ are the only "a" = American ones).
# `_v0*` variants (af_v0, af_v0bella, am_v0adam, ...) are excluded — older
# generation duplicates of voices already listed here under their current
# name.
#
# sex and age_feel below are NOT guesses — they're derived from real,
# measured fundamental frequency (median F0, autocorrelation over ~300+
# voiced frames per voice, from an actual sample of each via `voice
# sample`), bucketed using your thresholds:
#   female: <180Hz mature, 180-220Hz middle, >220Hz young
#   male:   <100Hz mature, 100-130Hz middle, >130Hz young
# age_feel per bucket: mature=[45,65], middle=[30,46], young=[20,32].
#
# texture is explicitly "unverified" — that's a timbre/character judgment
# pitch alone can't answer. Listen (`voice sample --voice <id> --text
# "..."`) and replace it with an actual word (warm, measured, weathered,
# neutral, ...) before relying on it for anything.
voices:
  # ---- female, mature (measured F0 < 180Hz) ----
