# Regional name pools, split by generation: "young" (ages 25-35, usually the
# narrator or their generation) and "old" (ages 55-70, usually the
# antagonist's generation). Seed.Region picks one of these regions, which
# drives which name pool, town list, and everyday detail the bible draws
# from — the model gets an allowed list, it doesn't invent names freely.
#
# bible.tmpl also receives the last 30 used_names/used_places from the
# store and is told not to reuse them, so within a region these pools
# should stay reasonably large.
regions:
  - name: midwest
    towns: [Cedar Falls, Millbrook, Elm Ridge, Prairie Junction, Fort Hollis, Maple Grove]
    generations:
      young:
        first_names: [Dana, Erin, Megan, Kyle, Brandon, Ashley, Kayla, Derek, Nicole, Tyler]
        last_names: [Whitfield, Novak, Sorensen, Kowalski, Dietrich, Halvorsen, Bruckner, Zielinski]
      old:
        first_names: [Carol, Russell, Sharon, Gerald, Judith, Wayne, Donna, Harold, Marlene, Earl]
        last_names: [Whitfield, Novak, Sorensen, Kowalski, Dietrich, Halvorsen, Bruckner, Zielinski]

